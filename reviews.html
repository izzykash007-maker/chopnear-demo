<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | ChopNearMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.stars button{background:#fff;border:2px solid var(--line);border-radius:10px;font-size:1.5rem;padding:4px 10px;cursor:pointer;color:#c9b6dc}.stars button.on{color:#ff9f1c;border-color:#ff9f1c}.rv{border-bottom:1px solid var(--line);padding:12px 0}.st{color:#ff9f1c;letter-spacing:2px}.badge{font-size:.78rem;font-weight:700;background:var(--saffron);padding:2px 10px;border-radius:999px}</style></head>
<body>
<div id="hdr"></div>
<main><div class="wrap" style="padding-top:28px;padding-bottom:50px"><div class="two">
 <div>
  <h2>Rate ChopNearMe</h2>
  <p class="lead">Customers and vendors: tell us what works and what we should fix. Your feedback helps us improve the platform.</p>
<div class="card" id="authBox" style="margin:14px 0"><strong id="who">You are not signed in</strong>
<form id="authForm" style="margin-top:10px"><label class="f">Email<input id="ae" type="email" autocomplete="email" required></label>
<label class="f">Password (6+ characters)<input id="ap" type="password" autocomplete="current-password" minlength="6" required></label>
<div class="row"><button class="btn leaf" type="submit">Log in</button><button class="btn ghost" type="button" id="signup">Create account</button></div></form>
<button class="btn ghost" id="logout" style="display:none;margin-top:10px">Log out</button><p id="amsg" role="status" class="note" style="font-weight:700;margin-top:8px"></p></div>
  <form class="card" id="rvForm">
   <div class="chips" role="radiogroup" aria-label="I am a"><input type="radio" name="rl" id="l1" value="customer" checked><label for="l1">Customer</label><input type="radio" name="rl" id="l2" value="vendor"><label for="l2">Vendor or chef</label></div>
   <div class="lab"><b>Your rating</b><div class="stars row" id="pick" style="margin-top:6px"></div></div>
   <label class="f">What should we keep or improve?<textarea id="cm" rows="4" minlength="5" maxlength="1000" required></textarea></label>
   <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="pub" style="width:auto" checked> Allow ChopNearMe to show this review publicly (after we check it)</label>
   <button class="btn leaf" type="submit">Send review</button><p id="rmsg" role="status" style="font-weight:700">Log in to send a review. Un-tick the box to send private feedback to the team only.</p>
  </form>
 </div>
 <div><h2>What people say</h2><p class="note" id="avg"></p><div id="rvs"></div></div>
</div>
</div></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const say=(id,t)=>{$(id).textContent=t};
const star=n=>"★".repeat(n)+"☆".repeat(5-n);
async function ensureProfile(u){await sb.from("profiles").upsert({id:u.id,full_name:(u.user_metadata&&u.user_metadata.full_name)||null})}
let USER=null;
function authUI(u){USER=u||null;$("who").textContent=u?"Signed in as "+u.email:"You are not signed in";$("authForm").style.display=u?"none":"grid";$("logout").style.display=u?"inline-block":"none";if(window.onAuth)onAuth()}
if(sb){sb.auth.getSession().then(r=>authUI(r.data.session&&r.data.session.user));sb.auth.onAuthStateChange((e,s)=>{authUI(s&&s.user);if(s&&s.user)ensureProfile(s.user)})}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!sb)return say("amsg","Database not available.");const r=await sb.auth.signInWithPassword({email:$("ae").value.trim(),password:$("ap").value});say("amsg",r.error?r.error.message:"Logged in.")});
$("signup").addEventListener("click",async()=>{if(!sb)return;const email=$("ae").value.trim(),password=$("ap").value;if(!email||password.length<6)return say("amsg","Enter an email and a password of 6 or more characters.");const r=await sb.auth.signUp({email,password});say("amsg",r.error?r.error.message:(r.data.session?"Account created. You are signed in.":"Account created. Check your email to confirm, then log in."))});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();say("amsg","Logged out.")});
function starPicker(id,cb){const el=$(id);el.innerHTML=[1,2,3,4,5].map(n=>"<button type=\"button\" data-n=\""+n+"\" aria-label=\""+n+" stars\">★</button>").join("");el.onclick=e=>{const b=e.target.closest("button");if(!b)return;cb(+b.dataset.n);[...el.children].forEach((x,i)=>x.classList.toggle("on",i<+b.dataset.n))}}
let rating=0;starPicker("pick",n=>rating=n);
async function load(){if(!sb)return;const r=await sb.from("platform_reviews").select("stars,comment,role,created_at").eq("approved",true).eq("share_publicly",true).order("created_at",{ascending:false}).limit(30);
 const d=r.data||[];$("avg").textContent=d.length?"Average "+(d.reduce((s,x)=>s+x.stars,0)/d.length).toFixed(1)+" out of 5 from "+d.length+" reviews":"";
 $("rvs").innerHTML=d.map(x=>"<div class=\"rv\"><span class=\"st\">"+star(x.stars)+"</span> <span class=\"badge\">"+(x.role==="vendor"?"Vendor":"Customer")+"</span><p>"+esc(x.comment)+"</p></div>").join("")||"<p class=\"note\">No public reviews yet. Be the first.</p>"}
$("rvForm").addEventListener("submit",async e=>{e.preventDefault();
 if(!USER)return say("rmsg","Please log in or create an account first.");if(!rating)return say("rmsg","Pick a star rating.");
 say("rmsg","Sending...");const row={user_id:USER.id,role:document.querySelector("input[name=rl]:checked").value,stars:rating,comment:$("cm").value.trim(),share_publicly:$("pub").checked};
 const r=await sb.from("platform_reviews").upsert(row,{onConflict:"user_id"});
 say("rmsg",r.error?"Could not send: "+r.error.message:"Thank you! "+(row.share_publicly?"Public reviews appear after we check them.":"Your private feedback went to the team."));if(!r.error)load()});
load();
</script></body></html>
