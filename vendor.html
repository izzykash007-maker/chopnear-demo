<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor profile | ChopNearMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.stars button{background:#fff;border:2px solid var(--line);border-radius:10px;font-size:1.5rem;padding:4px 10px;cursor:pointer;color:#c9b6dc}.stars button.on{color:#ff9f1c;border-color:#ff9f1c}.rv{border-bottom:1px solid var(--line);padding:12px 0}.st{color:#ff9f1c;letter-spacing:2px}.badge{font-size:.78rem;font-weight:700;background:var(--saffron);padding:2px 10px;border-radius:999px}</style></head>
<body>
<div id="hdr"></div>
<main><div class="wrap" style="padding-top:28px;padding-bottom:50px"><div id="prof"><p class="note">Loading...</p></div>
<section style="padding-top:24px"><h2>Customer reviews</h2><p class="note">Only customers with a completed, confirmed order can review a vendor.</p><div id="rvs"></div>
<div class="card" id="authBox" style="margin:14px 0"><strong id="who">You are not signed in</strong>
<form id="authForm" style="margin-top:10px"><label class="f">Email<input id="ae" type="email" autocomplete="email" required></label>
<label class="f">Password (6+ characters)<input id="ap" type="password" autocomplete="current-password" minlength="6" required></label>
<div class="row"><button class="btn leaf" type="submit">Log in</button><button class="btn ghost" type="button" id="signup">Create account</button></div></form>
<button class="btn ghost" id="logout" style="display:none;margin-top:10px">Log out</button><p id="amsg" role="status" class="note" style="font-weight:700;margin-top:8px"></p></div>
<form class="card" id="vForm" style="display:none"><div class="lab"><b>Rate this vendor</b><div class="stars row" id="pick" style="margin-top:6px"></div></div>
<label class="f">Your review<textarea id="cm" rows="3" maxlength="800" required></textarea></label><button class="btn leaf" type="submit">Post review</button><p id="vmsg" role="status" style="font-weight:700"></p></form></section>
</div></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const say=(id,t)=>{$(id).textContent=t};
const star=n=>"★".repeat(n)+"☆".repeat(5-n);
async function ensureProfile(u){await sb.from("profiles").upsert({id:u.id,full_name:(u.user_metadata&&u.user_metadata.full_name)||null})}
let USER=null;
function authUI(u){USER=u||null;$("who").textContent=u?"Signed in as "+u.email:"You are not signed in";$("authForm").style.display=u?"none":"grid";$("logout").style.display=u?"inline-block":"none";if(window.onAuth)onAuth()}
if(sb){sb.auth.getSession().then(r=>authUI(r.data.session&&r.data.session.user));sb.auth.onAuthStateChange((e,s)=>{authUI(s&&s.user);if(s&&s.user)ensureProfile(s.user)})}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!sb)return say("amsg","Database not available.");const r=await sb.auth.signInWithPassword({email:$("ae").value.trim(),password:$("ap").value});say("amsg",r.error?r.error.message:"Logged in.")});
$("signup").addEventListener("click",async()=>{if(!sb)return;const email=$("ae").value.trim(),password=$("ap").value;if(!email||password.length<6)return say("amsg","Enter an email and a password of 6 or more characters.");const r=await sb.auth.signUp({email,password});say("amsg",r.error?r.error.message:(r.data.session?"Account created. You are signed in.":"Account created. Check your email to confirm, then log in."))});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();say("amsg","Logged out.")});
function starPicker(id,cb){const el=$(id);el.innerHTML=[1,2,3,4,5].map(n=>"<button type=\"button\" data-n=\""+n+"\" aria-label=\""+n+" stars\">★</button>").join("");el.onclick=e=>{const b=e.target.closest("button");if(!b)return;cb(+b.dataset.n);[...el.children].forEach((x,i)=>x.classList.toggle("on",i<+b.dataset.n))}}
const VID=new URLSearchParams(location.search).get("id");let rating=0,orderId=null;starPicker("pick",n=>rating=n);
const TL={restaurant:"Restaurant",roadside_vendor:"Roadside vendor",online_vendor:"Online vendor",private_chef:"Private chef"};
async function load(){
 if(!sb||!VID){$("prof").innerHTML="<p class=\"note\">Vendor not found.</p>";return}
 const v=await sb.from("vendors").select("id,name,type,town,location_note,description,menu_items(name,price_xaf,available)").eq("id",VID).maybeSingle();
 if(!v.data){$("prof").innerHTML="<p class=\"note\">Vendor not found or not approved yet.</p>";return}
 const x=v.data,rt=await sb.from("vendor_ratings").select("avg_stars,n").eq("vendor_id",VID).maybeSingle();
 const menu=(x.menu_items||[]).filter(m=>m.available!==false).map(m=>"<div class=\"row\" style=\"justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)\"><span>"+esc(m.name)+"</span><b>"+m.price_xaf.toLocaleString("en-US")+" XAF</b></div>").join("");
 $("prof").innerHTML="<h1 style=\"font-size:2.2rem\">"+esc(x.name)+"</h1><p><span class=\"badge\">"+TL[x.type]+"</span> "+esc(x.town)+(x.location_note?" · "+esc(x.location_note):"")+"</p>"+(rt.data?"<p><span class=\"st\">"+star(Math.round(rt.data.avg_stars))+"</span> <b>"+rt.data.avg_stars+"</b> ("+rt.data.n+" reviews)</p>":"<p class=\"note\">No reviews yet</p>")+(x.description?"<p>"+esc(x.description)+"</p>":"")+"<h3 style=\"margin-top:18px\">Menu</h3>"+(menu||"<p class=\"note\">No items yet.</p>");
 const r=await sb.from("reviews").select("stars,comment,created_at").eq("vendor_id",VID).order("created_at",{ascending:false});
 $("rvs").innerHTML=(r.data||[]).map(y=>"<div class=\"rv\"><span class=\"st\">"+star(y.stars)+"</span><p>"+esc(y.comment||"")+"</p></div>").join("")||"<p class=\"note\">No reviews yet.</p>";
}
async function onAuth(){$("vForm").style.display="none";orderId=null;if(!USER||!sb)return;
 const o=await sb.from("orders").select("id").eq("vendor_id",VID).eq("customer_id",USER.id).eq("status","completed");
 const done=await sb.from("reviews").select("order_id").eq("vendor_id",VID).eq("customer_id",USER.id);
 const used=new Set((done.data||[]).map(z=>z.order_id));const free=(o.data||[]).find(z=>!used.has(z.id));
 if(free){orderId=free.id;$("vForm").style.display="grid"}}
$("vForm").addEventListener("submit",async e=>{e.preventDefault();if(!rating)return say("vmsg","Pick a star rating.");
 const r=await sb.from("reviews").insert({order_id:orderId,customer_id:USER.id,vendor_id:VID,stars:rating,comment:$("cm").value.trim()});
 say("vmsg",r.error?"Could not post: "+r.error.message:"Thanks! Your review is live.");if(!r.error){$("vForm").reset();load();onAuth()}});
load();
</script></body></html>
